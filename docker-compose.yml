services:
  # 1. Local LLM Inference Engine Container (Ollama ~500 MB)
  ollama-engine:
    image: ollama/ollama:latest
    container_name: doc-intelligence-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=2
    restart: always

  # 2. Automated Model Initializer (Pulls qwen2.5:0.5b into volume on boot)
  ollama-puller:
    image: curlimages/curl:latest
    container_name: doc-intelligence-puller
    depends_on:
      - ollama-engine
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama engine to start...';
        until curl -s http://ollama-engine:11434/api/tags > /dev/null; do sleep 2; done;
        echo 'Pulling ultra-fast lightweight model qwen2.5:0.5b...';
        curl -X POST http://ollama-engine:11434/api/pull -d '{\"name\": \"qwen2.5:0.5b\"}';
        echo 'Local lightweight LLM ready!';
      "

  # 3. RAG FastAPI Application Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-fastapi-backend
    environment:
      - USE_LOCAL_LLM=true
      - LOCAL_LLM_URL=http://ollama-engine:11434/v1
      - LOCAL_LLM_MODEL=qwen2.5:0.5b


    ports:
      - "8080:8080"
    depends_on:
      - ollama-engine

volumes:
  ollama_storage:
